[package]
name = "claude-cockpit"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "cpit"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
anyhow = "1"
ctrlc = "3"
regex = "1"
which = "6"
wait-timeout = "0.2"

[profile.release]
opt-level = 2
