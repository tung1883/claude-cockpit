[package]
name = "claude-cockpit"
version = "0.1.0"
edition = "2021"
default-run = "cpit"

[[bin]]
name = "cpit"
path = "src/main.rs"

# Same code under a second name, so a work-in-progress build can be installed
# next to the stable one: `cargo install --path . --force --bin cpit-dev`.
[[bin]]
name = "cpit-dev"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
sha1 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
anyhow = "1"
ctrlc = "3"
regex = "1"
which = "6"
wait-timeout = "0.2"
portable-pty = "0.9"
vt100 = "0.15"

[profile.release]
opt-level = 2
